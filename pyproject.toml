[project]
name = "polybot"
version = "0.0.1"
description = "Autonomous Polymarket trading bot — ingestion layer + ERS (see docs/)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "websockets>=16",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
