{
  "model": {
    "default": "OWNER_CONFIG_REQUIRED",
    "provider": "OWNER_CONFIG_REQUIRED"
  },
  "mcp_servers": {
    "polymarket": {
      "command": "/opt/polymarket-bot/.venv/bin/python",
      "args": [
        "-m",
        "polybot.hermes.mcp_bridge",
        "--socket",
        "/run/polybot-proposal/proposal.sock"
      ],
      "env": {
        "PYTHONPATH": "/opt/polymarket-bot/src"
      },
      "enabled": true,
      "timeout": 5,
      "connect_timeout": 5,
      "supports_parallel_tool_calls": false,
      "tools": {
        "include": [
          "propose_trade",
          "get_market",
          "get_book",
          "get_ledger",
          "get_flags"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "platform_toolsets": {
    "api_server": [],
    "bluebubbles": [],
    "cli": [],
    "cron": [],
    "dingtalk": [],
    "discord": [],
    "email": [],
    "feishu": [],
    "google_chat": [],
    "homeassistant": [],
    "irc": [],
    "line": [],
    "matrix": [],
    "mattermost": [],
    "msgraph_webhook": [],
    "ntfy": [],
    "photon": [],
    "qqbot": [],
    "raft": [],
    "relay": [],
    "signal": [],
    "simplex": [],
    "slack": [],
    "sms": [],
    "teams": [],
    "telegram": [],
    "webhook": [],
    "wecom": [],
    "wecom_callback": [],
    "weixin": [],
    "whatsapp": [],
    "whatsapp_cloud": [],
    "yuanbao": []
  },
  "platforms": {
    "api_server": {"enabled": false},
    "bluebubbles": {"enabled": false},
    "dingtalk": {"enabled": false},
    "discord": {"enabled": false},
    "email": {"enabled": false},
    "feishu": {"enabled": false},
    "google_chat": {"enabled": false},
    "homeassistant": {"enabled": false},
    "irc": {"enabled": false},
    "line": {"enabled": false},
    "matrix": {"enabled": false},
    "mattermost": {"enabled": false},
    "msgraph_webhook": {"enabled": false},
    "ntfy": {"enabled": false},
    "photon": {"enabled": false},
    "qqbot": {"enabled": false},
    "raft": {"enabled": false},
    "relay": {"enabled": false},
    "signal": {"enabled": false},
    "simplex": {"enabled": false},
    "slack": {"enabled": false},
    "sms": {"enabled": false},
    "teams": {"enabled": false},
    "telegram": {"enabled": false},
    "webhook": {"enabled": false},
    "wecom": {"enabled": false},
    "wecom_callback": {"enabled": false},
    "weixin": {"enabled": false},
    "whatsapp": {"enabled": false},
    "whatsapp_cloud": {"enabled": false},
    "yuanbao": {"enabled": false}
  },
  "agent": {
    "disabled_toolsets": ["feishu_doc", "feishu_drive", "kanban"],
    "reasoning_effort": "high",
    "restart_drain_timeout": 20
  },
  "kanban": {
    "dispatch_in_gateway": false
  },
  "memory": {
    "memory_enabled": true,
    "user_profile_enabled": true,
    "write_approval": false,
    "provider": ""
  },
  "skills": {
    "external_dirs": [],
    "inline_shell": false,
    "write_approval": false
  },
  "approvals": {
    "mode": "manual",
    "cron_mode": "deny",
    "mcp_reload_confirm": true
  },
  "security": {
    "allow_private_urls": false,
    "redact_secrets": true,
    "tirith_enabled": true,
    "tirith_fail_open": false,
    "allow_lazy_installs": false
  },
  "hooks_auto_accept": false
}
