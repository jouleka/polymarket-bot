# polymarket-bot composite paper-shadow runtime config.
# Copy to /opt/polymarket-bot/config.toml and adjust; read by
# polybot.runtime.shadow_config.load_shadow_config.
# Any field can be overridden by an env var POLYBOT_INGEST_<FIELD_UPPERCASE>
#   (e.g. POLYBOT_INGEST_UNIVERSE_MAX_MARKETS=400), which the systemd .env (EnvironmentFile) can carry.

db_path = "/opt/polymarket-bot/data/market_memory.db"   # versioned midpoint batches + full deduplicated trade tape (no raw CLOB frames)
universe_max_markets = 200            # start conservative (top-N active binary markets by 24h volume); widen once proven
max_assets_per_shard = 25             # bound one divergence/resync to 25 token books
snapshot_interval_seconds = 60.0      # persist one global midpoint batch per minute; every WS frame still updates live books
data_api_enabled = true               # also poll the Data API /trades tape
data_api_interval_seconds = 2.0
data_api_limit = 500                  # /trades page size
heartbeat_path = "/opt/polymarket-bot/data/heartbeat"   # liveness file (out-of-process readable)
heartbeat_interval_seconds = 5.0
log_level = "INFO"

[shadow]
intents_db_path = "/opt/polymarket-bot/data/intents.db"
forecasts_db_path = "/opt/polymarket-bot/data/forecasts.db"
components_db_path = "/opt/polymarket-bot/data/components.db"
maker_db_path = "/opt/polymarket-bot/data/maker.db"
shadow_db_path = "/opt/polymarket-bot/data/shadow.db"
resolution_db_path = "/opt/polymarket-bot/data/resolution.db"
cycle_interval_seconds = 1.0
registry_refresh_seconds = 300.0
registry_max_age_seconds = 900.0
resolution_poll_seconds = 60.0
news_poll_seconds = 60.0
rpc_timeout_seconds = 15.0
readiness_timeout_seconds = 60.0
outbox_batch_limit = 100
status_path = "/run/polybot/shadow-status.json"
proposal_socket_path = "/run/polybot-proposal/proposal.sock"
proposal_socket_group = "polybot-proposal"
proposal_max_per_minute = 20
proposal_request_timeout_seconds = 2.0

[[shadow.polygon_providers]]
provider_id = "polygon-publicnode"
url = "https://polygon-bor-rpc.publicnode.com"

[[shadow.polygon_providers]]
provider_id = "polygon-drpc"
url = "https://polygon.drpc.org"
